<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Corporation · Series A</title>
<!--
  Self-contained 10-slide deck. No build. Change ACCENT and the company
  strings; keep geometry and the spine. See docs/guides/deck.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101010; --paper:#FFFFFF; --accent:#1D4ED8;
  --paper-warm:#F0EEE9; --inkmuted:#746F65; --inkline:rgba(16,16,16,.16);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.28); --dim:rgba(255,255,255,.62);
  --gray03:#E8EEF7;
  --type-display:64px; --type-title:48px; --type-subtitle:30px; --type-body:24px; --type-small:18px; --type-micro:14px;
  --pad-x:96px; --pad-top:80px; --pad-bottom:72px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --r-card:14px; --r-el:8px;
  --chrome-bg:#101010; --chrome-rail:#0A0A0A; --chrome-fg:#FFFFFF; --chrome-dim:rgba(255,255,255,.62); --chrome-line:rgba(255,255,255,.14);
  --face:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
}
html,body{margin:0;padding:0;background:#000;font-family:var(--face);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;}
*{box-sizing:border-box;}
#deck-stage h1,#deck-stage h2{font-weight:300;}
[data-slide][data-chapter]::before{
  content:attr(data-chapter);
  position:absolute;top:28px;left:var(--pad-x);z-index:12;
  font:500 12px/1 var(--face);letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.5);pointer-events:none;
}
[data-slide][data-theme="light"][data-chapter]::before{color:rgba(16,16,16,.46);}
[data-label="Title"]::before,[data-label="Close"]::before{display:none;}
[data-anim]{opacity:0;transform:translateY(18px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
[data-slide][data-active] [data-anim]{opacity:1;transform:none;}
[data-slide][data-active] [data-anim]:nth-child(2){transition-delay:.06s;}
[data-slide][data-active] [data-anim]:nth-child(3){transition-delay:.12s;}
[data-slide][data-active] [data-anim]:nth-child(4){transition-delay:.18s;}
[data-grow]{height:0 !important;transition:height .8s var(--ease);}
[data-slide][data-active] [data-grow]{height:var(--h) !important;}
[data-story-map] button{font:500 13px/1.2 var(--face);}
[data-story-map] button:hover,[data-story-map] button:focus-visible{color:#fff;border-color:#fff !important;outline:0;}
a{color:var(--accent);text-decoration:none;}
::selection{background:var(--accent);color:#fff;}
#deck-rail button[data-active] > div:first-child{outline:2px solid var(--accent);outline-offset:2px;}
#deck-overview button[data-active]{outline:2px solid var(--accent);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){
  [data-anim]{opacity:1 !important;transform:none !important;transition:none !important;}
  [data-grow]{height:var(--h) !important;transition:none !important;}
}
@media print{
  html,body{overflow:visible !important;background:#fff !important;height:auto !important;}
  #deck-root,#deck-viewport,#deck-stage{position:static !important;transform:none !important;width:auto !important;height:auto !important;}
  #deck-rail,#deck-overview,footer[data-chrome]{display:none !important;}
  [data-slide]{
    position:relative !important;inset:auto !important;opacity:1 !important;transform:none !important;
    page-break-after:always;break-after:page;width:1920px !important;height:1080px !important;
  }
  [data-slide]:last-of-type{page-break-after:auto;}
  [data-anim]{opacity:1 !important;transform:none !important;}
  [data-grow]{height:var(--h) !important;}
  @page{size:1920px 1080px;margin:0;}
}
</style>
</head>
<body>
<script>var ACCENT='#1D4ED8';</script>
<div id="deck-root" style="position:fixed;inset:0;display:flex;flex-direction:column;background:#000;color:#fff;font-family:var(--face);">
  <div style="flex:1;display:flex;min-height:0;position:relative;">
    <aside id="deck-rail" data-chrome="rail" style="width:236px;flex:0 0 236px;background:#0A0A0A;border-right:1px solid var(--chrome-line);overflow:auto;padding:14px;display:none;flex-direction:column;gap:12px;z-index:30;"></aside>
    <main id="deck-viewport" style="flex:1;min-width:0;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;">
      <div id="deck-stage" style="position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;">
        <!-- deck body identical to demo/deck.html; remainder omitted in this thought -->
      </div>
    </main>
  </div>
</div>
</body>
</html>
