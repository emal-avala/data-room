name: Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish demo/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: demo
          branch: gh-pages
          clean: true
